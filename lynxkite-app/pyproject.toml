[project]
name = "lynxkite-app"
version = "0.3.0"
description = "The LynxKite application, with web server and UI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.6",
    "griffe>=2.0.2",
    "httpx>=0.28.1",
    "joblib>=1.5.1",
    "lynxkite-core",
    "pycrdt-websocket>=0.16",
    "pycrdt>=0.12.26",
    "pydantic>=2.11.7",
    "pydantic-core>=2.46.4",
    "pyte>=0.8.2",
    "python-jose[cryptography]>=3.5.0",
    "sse-starlette>=2.2.1",
    "tqdm>=4.67.1",
    "uvicorn>=0.35.0",
    "watchdog>=6.0.0",
    "websockets>=16.0",
]
license = "AGPL-3.0-or-later"

[project.urls]
Homepage = "https://github.com/lynxkite/lynxkite-2000/"

[dependency-groups]
dev = ["hatchling>=1.27", "pydantic-to-typescript>=2.0.0"]

[tool.uv.sources]
lynxkite-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lynxkite_app"]

[tool.hatch.build.targets.sdist]
include = [
    "/hatch_build.py",
    "/pyproject.toml",
    "/README.md",
    "/src/lynxkite_app",
    "/web",
]
exclude = ["/web/node_modules"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[project.scripts]
lynxkite = "lynxkite_app.__main__:main"

[tool.deptry.package_module_name_map]
sse-starlette = "starlette"
"pydantic-to-typescript" = "pydantic_to_typescript"

[tool.deptry.per_rule_ignores]
DEP001 = ["lynxkite_enterprise"]
DEP002 = ["pycrdt-websocket", "griffe"]
DEP003 = ["lynxkite_assistant", "lynxkite_enterprise"]
DEP004 = ["hatchling"]
